<script>
document.addEventListener('DOMContentLoaded', () => {
  // kidxごとのデータ構造
  // { baseWidth, baseHeight, strokes: [ "M...", "M..." ], selectedIndices: Set(0, 1) }
  const pathDataMap = {};

  const qelms = document.querySelectorAll('div.qelm');

  qelms.forEach(qelm => {
    const kidxEl = qelm.querySelector('div.kidx');
    if (!kidxEl) return;
    
    const kidxClass = Array.from(kidxEl.classList).find(c => c.startsWith('kidx') && c !== 'kidx');
    if (!kidxClass) return;

    // SVGコンテナとCanvasの設置
    const canvas = document.createElement('canvas');
    canvas.className = 'handwriting-canvas';
    
    const svgContainer = document.createElement('div');
    svgContainer.className = 'handwriting-svg-container';
    svgContainer.innerHTML = `<svg width="100%" height="100%" preserveAspectRatio="none" style="position:absolute; top:0; left:0; overflow:visible;"></svg>`;

    qelm.appendChild(svgContainer);
    qelm.appendChild(canvas);

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let isDrawing = false;
    let currentPath = [];

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top,
        width: rect.width,
        height: rect.height
      };
    }

    // 描画開始
    function startDrawing(e) {
      // 左クリック(button === 0)・タッチ時のみ手書きを行う
      if (e.button !== undefined && e.button !== 0) return;

      isDrawing = true;
      const pt = getCanvasCoords(e);
      
      if (!pathDataMap[kidxClass]) {
        pathDataMap[kidxClass] = {
          baseWidth: pt.width,
          baseHeight: pt.height,
          strokes: [],
          selectedIndices: new Set()
        };
      }

      currentPath = [`M ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`];
      e.preventDefault();
    }

    // 描画中
    function draw(e) {
      if (!isDrawing) return;
      const pt = getCanvasCoords(e);
      currentPath.push(`L ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`);

      // 描画中の仮ストロークを含めてリアルタイム同期
      const data = pathDataMap[kidxClass];
      const tempStrokes = [...data.strokes, currentPath.join(' ')];
      syncKidxDisplay(kidxClass, tempStrokes);
      e.preventDefault();
    }

    // 描画終了
    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;

      if (currentPath.length > 0) {
        const data = pathDataMap[kidxClass];
        data.strokes.push(currentPath.join(' '));
        syncKidxDisplay(kidxClass, data.strokes);
      }
    }

    // 右クリック（コンテキストメニュー）で線を判定して赤く光らせる（トグル）
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault(); // コンテキストメニュー表示の無効化

      const data = pathDataMap[kidxClass];
      if (!data || data.strokes.length === 0) return;

      const pt = getCanvasCoords(e);

      // SVG上の各path要素とクリック点との最短距離を計算して判定
      const svgEl = svgContainer.querySelector('svg');
      const pathEls = svgEl.querySelectorAll('path.stroke-path');

      let closestIndex = -1;
      let minDistance = Infinity;

      pathEls.forEach((pathEl, idx) => {
        // SVG要素上の最寄りの点とマウス位置の距離判定
        const length = pathEl.getTotalLength();
        const steps = Math.max(10, Math.floor(length / 2));
        
        for (let i = 0; i <= steps; i++) {
          const point = pathEl.getPointAtLength((i / steps) * length);
          const dist = Math.hypot(point.x - pt.x, point.y - pt.y);
          if (dist < minDistance) {
            minDistance = dist;
            closestIndex = idx;
          }
        }
      });

      // マウス位置から20px以内に線がある場合、選択状態を反転
      if (closestIndex !== -1 && minDistance < 20) {
        if (data.selectedIndices.has(closestIndex)) {
          data.selectedIndices.delete(closestIndex);
        } else {
          data.selectedIndices.add(closestIndex);
        }
        syncKidxDisplay(kidxClass, data.strokes);
      }
    });

    // イベントのバインド
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);
  });

  // 分離された各 <path> 要素をレンダリングして全マスに同期させる関数
  function syncKidxDisplay(kidxClass, strokesArray) {
    const data = pathDataMap[kidxClass];
    if (!data) return;

    const targets = document.querySelectorAll(`.${kidxClass}`);

    targets.forEach(kidxEl => {
      const qelm = kidxEl.closest('div.qelm');
      if (!qelm) return;

      const svgEl = qelm.querySelector('svg');
      if (!svgEl) return;

      svgEl.setAttribute('viewBox', `0 0 ${data.baseWidth} ${data.baseHeight}`);

      // strokeごとに個別 <path> を生成して挿入
      const pathHTML = strokesArray.map((strokeD, idx) => {
        const isSelected = data.selectedIndices.has(idx);
        const activeClass = isSelected ? 'stroke-path highlighted' : 'stroke-path';
        return `<path class="${activeClass}" d="${strokeD}" />`;
      }).join('');

      svgEl.innerHTML = pathHTML;
    });
  }
});
</script></head>
